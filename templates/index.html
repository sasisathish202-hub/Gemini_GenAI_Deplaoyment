
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
            text-align: center;
        }

        h1 {
            color: #4f46e5;
        }

        textarea {
            width: 95%;
            height: 130px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 18px;
            padding: 12px 28px;
            color: white;
            background: #4f46e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Gemini AI Chatbot</h1>
        <p>Ask a question and get an AI response.</p>

        <form action="/chat" method="POST">
            <textarea
                name="prompt"
                placeholder="Search here..."
                required
            ></textarea>

            <br>
            <button type="submit">Ask Gemini</button>
        </form>
    </div>
</body>
</html>
